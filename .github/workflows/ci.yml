name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q
        env:
          # The suite must never reach the real API or a real ~/.trello.
          TRELLO_API_KEY: ci-key
          TRELLO_TOKEN: ci-token

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
